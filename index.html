<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个功能完整的待办事项应用，支持本地存储、优先级管理和截止日期">
    <meta name="theme-color" content="#007bff">
    <title>Todo App - 待办事项管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <h1 class="app-title">✓ Todo App</h1>
                    <p class="app-subtitle">有效管理你的日常任务</p>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="btn btn-icon" title="切换主题">
                        <span id="themeIcon"></span>
                    </button>
                    <button id="settingsBtn" class="btn btn-icon" title="设置">
                        <span>⚙️</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主输入区 -->
        <section class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="添加新的任务..."
                    autocomplete="off"
                >
                <button id="addBtn" class="btn btn-primary btn-add">+ 添加</button>
            </div>
            
            <!-- 扩展选项 -->
            <div class="expand-options" id="expandOptions" style="display: none;">
                <div class="option-group">
                    <label for="prioritySelect">优先级:</label>
                    <select id="prioritySelect" class="select-control">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <label for="categorySelect">分类:</label>
                    <select id="categorySelect" class="select-control">
                        <option value="work">工作</option>
                        <option value="personal" selected>个人</option>
                        <option value="shopping">购物</option>
                        <option value="health">健康</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <label for="dueDateInput">截止日期:</label>
                    <input type="date" id="dueDateInput" class="date-input">
                </div>
            </div>
        </section>

        <!-- 操作栏 -->
        <section class="toolbar">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">
                    <span>全部</span>
                    <span class="count" id="countAll">0</span>
                </button>
                <button class="filter-btn" data-filter="active">
                    <span>进行中</span>
                    <span class="count" id="countActive">0</span>
                </button>
                <button class="filter-btn" data-filter="completed">
                    <span>已完成</span>
                    <span class="count" id="countCompleted">0</span>
                </button>
            </div>
            
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="搜索任务..."
                >
            </div>
            
            <div class="toolbar-actions">
                <button id="sortBtn" class="btn btn-secondary" title="排序">
                    📋 排序
                </button>
                <button id="exportBtn" class="btn btn-secondary" title="导出">
                    📑 导出
                </button>
                <button id="importBtn" class="btn btn-secondary" title="导入">
                    📒 导入
                </button>
                <input type="file" id="importFile" class="hidden-input" accept=".json">
            </div>
        </section>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 统计信息 -->
            <div class="stats-panel">
                <div class="stat-item">
                    <div class="stat-value" id="totalTasks">0</div>
                    <div class="stat-label">总任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activeTasks">0</div>
                    <div class="stat-label">进行中</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completedTasks">0</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completionRate">0%</div>
                    <div class="stat-label">完成率</div>
                </div>
            </div>

            <!-- 任务列表 -->
            <div class="todos-container" id="todosContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h2>没有任务</h2>
                    <p>点击上方添加新任务开始</p>
                </div>
            </div>
        </main>

        <!-- 底部动作 -->
        <footer class="footer">
            <button id="clearCompletedBtn" class="btn btn-danger" style="display: none;">
                🗑️ 清空已完成
            </button>
            <div class="footer-info">
                <p>📄 批量删除: <input type="checkbox" id="selectAllCheckbox"> 全选</p>
            </div>
        </footer>
    </div>

    <!-- 上下文菜单 -->
    <div class="context-menu" id="contextMenu" style="display: none;">
        <button class="context-menu-item" data-action="edit">编辑</button>
        <button class="context-menu-item" data-action="duplicate">复制</button>
        <button class="context-menu-item" data-action="delete">删除</button>
    </div>

    <!-- 模态框 - 编辑 -->
    <div class="modal" id="editModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑任务</h2>
                <button class="btn-close" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>任务标题</label>
                    <input type="text" id="editTitle" class="form-control">
                </div>
                <div class="form-group">
                    <label>任务描述</label>
                    <textarea id="editDescription" class="form-control form-textarea"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="editPriority" class="form-control">
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="editCategory" class="form-control">
                            <option value="work">工作</option>
                            <option value="personal">个人</option>
                            <option value="shopping">购物</option>
                            <option value="health">健康</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="date" id="editDueDate" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
                <button class="btn btn-primary" id="saveEditBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 模态框 - 设置 -->
    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="btn-close" id="closeSettingsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>整体设置</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableNotifications" class="checkbox-input">
                        启用提醒
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableDueDate" class="checkbox-input" checked>
                        启用截止日期
                    </label>
                </div>
                <div class="settings-group">
                    <h3>数据管理</h3>
                    <button class="btn btn-info" id="backupBtn">
                        💡 数据备份
                    </button>
                    <button class="btn btn-warning" id="restoreBtn" style="display: none;">
                        📄 恢复数据
                    </button>
                    <button class="btn btn-danger" id="resetBtn">
                        🗑️ 清空所有数据
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- 脚本 -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
